<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProofPay</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --ink:#1c2333; --muted:#6b7385; --brand:#2563eb; --ok:#15803d; --warn:#b45309; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 880px; margin: 0 auto; padding: 24px; }
  h1 { margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 12px; }
  a { color: var(--brand); }
  .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid #d5d9e3; }
  .wide { grid-column: 1 / -1; }
  button { background: var(--brand); color: #fff; border: 0; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 6px; border-bottom: 1px solid #eceef4; }
  .badge { padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .PAID { background: #dcfce7; color: var(--ok); }
  .PENDING { background: #fef3c7; color: var(--warn); }
  #banner { display: none; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; background: #dcfce7; color: var(--ok); }
  #banner.err { background: #fee2e2; color: #b91c1c; }
  #result { display: none; text-align: center; }
  #result img { width: 180px; height: 180px; }
</style>
</head>
<body>
<main>
  <h1>ProofPay</h1>
  <p class="sub">Every bill gets a payment link. Paid means paid, verified by PayPal.</p>
  <p><a href="/disputes.html">Open dispute inbox</a></p>

  <div id="banner"></div>

  <div class="card">
    <form id="billForm">
      <input class="wide" id="customer" placeholder="Customer name" required>
      <input id="amount" type="number" step="0.01" min="0.01" placeholder="Amount (USD)" required>
      <input id="note" placeholder="Items / note">
      <button class="wide" type="submit">Create bill</button>
    </form>
  </div>

  <div class="card" id="result">
    <h3 id="resultTitle"></h3>
    <img id="resultQr" alt="Payment QR">
    <p><a id="resultLink" target="_blank" rel="noopener">Open pay link</a></p>
  </div>

  <div class="card">
    <h3>Bills</h3>
    <table>
      <thead><tr><th>Customer</th><th>Amount</th><th>Status</th><th>Created</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);

function showBanner(text, isError) {
  const b = $('#banner');
  b.textContent = text;
  b.className = isError ? 'err' : '';
  b.style.display = 'block';
}

const params = new URLSearchParams(location.search);
if (params.get('paid')) showBanner('Payment received and verified by PayPal');
else if (params.get('cancelled')) showBanner('Payment was cancelled', true);
else if (params.get('error')) showBanner('Something went wrong with the payment', true);
if ([...params.keys()].length) history.replaceState(null, '', '/');

async function loadBills() {
  const bills = await (await fetch('/api/bills')).json();
  const rows = $('#rows');
  rows.replaceChildren();
  for (const b of bills) {
    const tr = document.createElement('tr');
    for (const text of [b.customer, '$' + b.amount.toFixed(2)]) {
      const td = document.createElement('td');
      td.textContent = text;
      tr.appendChild(td);
    }
    const st = document.createElement('td');
    const badge = document.createElement('span');
    badge.className = 'badge ' + b.status;
    badge.textContent = b.status;
    st.appendChild(badge);
    tr.appendChild(st);
    const when = document.createElement('td');
    when.textContent = new Date(b.createdAt).toLocaleString();
    tr.appendChild(when);
    rows.appendChild(tr);
  }
}

$('#billForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await fetch('/api/bills', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      customer: $('#customer').value,
      amount: $('#amount').value,
      note: $('#note').value,
    }),
  });
  const data = await res.json();
  if (!res.ok) return showBanner(data.error || 'Could not create bill', true);
  $('#resultTitle').textContent = `Bill for ${data.customer}: $${data.amount.toFixed(2)}`;
  $('#resultQr').src = data.qr;
  $('#resultLink').href = data.payUrl;
  $('#result').style.display = 'block';
  e.target.reset();
  loadBills();
});

loadBills();
setInterval(loadBills, 5000);
</script>
</body>
</html>
